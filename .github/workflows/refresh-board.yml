name: Refrescar board (metricas FB/IG)

# Corre en la NUBE cada hora — sin depender de que la Mac este prendida ni del WiFi.
# Boton manual "Run workflow" (workflow_dispatch) disparable desde el cel (app de GitHub).
# Antes de que exista el Secret YOD_META_TOKEN, cada corrida es un no-op limpio (verde).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# concurrencia: nunca dos corridas escribiendo a la vez
concurrency:
  group: refresh-board
  cancel-in-progress: false

# El productor abre PR y solicita su validación; nunca empuja main.
permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Hay token?
        id: tok
        env:
          YOD_META_TOKEN: ${{ secrets.YOD_META_TOKEN }}
        run: |
          if [ -n "$YOD_META_TOKEN" ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin Secret YOD_META_TOKEN todavia; corrida no-op (agrega el token para activar)."
          fi

      - name: Validar configuración de la App publicadora
        if: steps.tok.outputs.hay == 'si'
        env:
          YOD_PUBLISHER_APP_ID: ${{ vars.YOD_PUBLISHER_APP_ID }}
          YOD_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.YOD_PUBLISHER_APP_PRIVATE_KEY }}
        run: |
          if ! [[ "$YOD_PUBLISHER_APP_ID" =~ ^[0-9]+$ ]] || [ -z "$YOD_PUBLISHER_APP_PRIVATE_KEY" ]; then
            echo "::error::Configura YOD_PUBLISHER_APP_ID y YOD_PUBLISHER_APP_PRIVATE_KEY antes de generar métricas."
            exit 1
          fi

      - name: Jalar metricas de FB/IG
        if: steps.tok.outputs.hay == 'si'
        env:
          YOD_META_TOKEN: ${{ secrets.YOD_META_TOKEN }}
          AURUM_QAA_TOKEN: ${{ secrets.AURUM_QAA_TOKEN }}   # iman Arquitectura de Autor
        run: python scripts/pull_metrics.py

      - name: Detectar cambios para publicar
        id: cambios
        if: steps.tok.outputs.hay == 'si'
        run: node scripts/publicar-metricas.cjs --check-changes >> "$GITHUB_OUTPUT"

      - name: Crear token de la App sólo para abrir el PR
        id: pr-token
        if: steps.cambios.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.YOD_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.YOD_PUBLISHER_APP_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: read
          permission-pull-requests: write

      - name: Proponer y validar la actualización
        if: steps.cambios.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_CREATION_TOKEN: ${{ steps.pr-token.outputs.token }}
        run: node scripts/publicar-metricas.cjs
