name: Refrescar board (metricas FB/IG)

# Corre en la NUBE cada hora — sin depender de que la Mac este prendida ni del WiFi.
# Boton manual "Run workflow" (workflow_dispatch) disparable desde el cel (app de GitHub).
# Antes de que exista el Secret YOD_META_TOKEN, cada corrida es un no-op limpio (verde).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/snapshots_online.py, metrics-online.js, .github/workflows/refresh-board.yml]

# concurrencia: nunca dos corridas escribiendo a la vez
concurrency:
  group: refresh-board
  cancel-in-progress: false

# El productor abre PR y solicita su validación; nunca empuja main.
permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Hay token?
        id: tok
        env:
          YOD_META_TOKEN: ${{ secrets.YOD_META_TOKEN }}
        run: |
          if [ -n "$YOD_META_TOKEN" ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin Secret YOD_META_TOKEN todavia; corrida no-op (agrega el token para activar)."
          fi

      - name: Recuperar última versión y serializar datos
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/snapshots_online.py bootstrap --proceso metricas --lock

      - name: Jalar metricas de FB/IG
        if: steps.tok.outputs.hay == 'si'
        env:
          YOD_META_TOKEN: ${{ secrets.YOD_META_TOKEN }}
          AURUM_QAA_TOKEN: ${{ secrets.AURUM_QAA_TOKEN }}   # iman Arquitectura de Autor
        run: python scripts/pull_metrics.py

      - name: Validar los datos públicos y los contratos
        if: steps.tok.outputs.hay == 'si'
        run: |
          python3 -m json.tool metrics.json >/dev/null
          python3 -m unittest discover -s tests -p leads_metricas_test.py
          python3 -m unittest discover -s tests -p snapshots_online_test.py
          node --test tests/*.cjs
      - name: Guardar versión privada verificada
        if: steps.tok.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/snapshots_online.py preparar --proceso metricas
      - name: Publicar sólo métricas y portadas; confirmar recibo
        if: steps.tok.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/snapshots_online.py publicar-raw
      - name: Comprobar el lector real con el recibo y los datos publicados
        if: steps.tok.outputs.hay == 'si'
        run: |
          node -e "require('./metrics-online.js').load().then(r=>console.log('LECTOR_ONLINE '+JSON.stringify({ok:true,posts:r.metrics.posts.length,run_id:r.receipt.run_id,data_sha:r.receipt.data_sha}))).catch(e=>{console.error(e.message);process.exitCode=1})"
      - name: Liberar mutex
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/snapshots_online.py liberar
